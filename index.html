<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1c2330">
<link rel="manifest" href="manifest.webmanifest">

<title>Verkpunktar</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#15181e;--mut:#6b7280;--line:#e2e5ea;--acc:#e8641b;--accd:#c4500f;--hd:#1c2330;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:54px;flex:none}
header button{background:none;border:0;color:#fff;font-size:24px;width:40px;height:40px;border-radius:10px;line-height:1}
header button:active{background:#ffffff1f}
#back[hidden]{display:block;visibility:hidden}
#title{flex:1;min-width:0}
#title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title small{display:block;opacity:.6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:inline-flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);display:inline-block}
#banner{background:#fff4e5;color:#7a4500;font-size:13px;padding:7px 14px;flex:none}
#banner:empty{display:none}
main{flex:1;overflow:auto;position:relative}
main.full{overflow:hidden;background:#d9dce1}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 100px}
h2{font-size:20px;margin:6px 0 14px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:22px 0 8px;font-weight:600}
.path{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px}
.path a{color:var(--mut);text-decoration:none;cursor:pointer}
.path a:hover{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.rows .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.rows .row:last-child{border-bottom:0}
.rows .row:active{background:#f7f7f9}
.ico{width:38px;height:38px;border-radius:10px;background:#fdeee4;color:var(--acc);display:grid;place-items:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.grow small{color:var(--mut);font-size:13px}
.chev{color:#b5bac3;font-size:20px}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#e5484d;color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.badge.ok{background:#30a46c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.tile .th{aspect-ratio:4/3;background:#eceef1 center/contain no-repeat}
.tile .nm{padding:8px 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{position:absolute;top:8px;right:8px}
.tile.add{border:2px dashed #cfd3da;background:transparent;align-items:center;justify-content:center;color:var(--mut);min-height:150px;gap:6px;font-size:13px;text-align:center;padding:10px}
.tile.add span{font-size:28px;color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn:active{background:var(--accd)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:#d23a3f;border:1px solid #f1c4c6}
.addrow{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--acc);font-weight:600;cursor:pointer}
.tabs{display:flex;gap:4px;background:#e6e8ec;padding:4px;border-radius:12px;margin:4px 0 6px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--hd);border-color:var(--hd);color:#fff}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.pnum{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.stl{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:#f1f2f4}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.fab{position:fixed;right:18px;bottom:22px;z-index:5;box-shadow:0 6px 18px #e8641b55;border-radius:28px;padding:14px 20px}
/* viewer */
.viewer{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.viewer.adding{cursor:crosshair}
.inner{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
.inner img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;background:#fff;box-shadow:0 2px 12px #0003}
.pin{position:absolute;width:34px;height:34px;margin:0;transform:translate(-50%,-100%) scale(var(--inv));transform-origin:50% 100%;cursor:pointer;z-index:1}
.pin::before{content:"";position:absolute;inset:0;background:var(--c);border:2.5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px #0006}
.pin span{position:relative;display:grid;place-items:center;height:30px;color:#fff;font-weight:800;font-size:13px}
.pin.sel{z-index:2}
.pin.sel::before{box-shadow:0 0 0 4px #ffffffcc,0 0 0 7px var(--c)}
.vbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;z-index:3;background:#1c2330ee;padding:6px;border-radius:16px;box-shadow:0 6px 20px #0004}
.vbar button{background:transparent;color:#fff;border:0;border-radius:11px;padding:10px 14px;font-weight:600;white-space:nowrap}
.vbar button.on{background:var(--acc)}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#1c2330ee;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:3;white-space:nowrap}
.hint[hidden]{display:none}
/* panel */
#panel{position:fixed;left:0;right:0;bottom:0;height:62vh;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px #0003;z-index:20;transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel .grab{width:40px;height:5px;background:#d4d7dc;border-radius:3px;margin:8px auto 0;flex:none}
#pbody{overflow:auto;padding:8px 16px 24px;flex:1}
@media(min-width:900px){#panel{left:auto;top:0;width:400px;height:auto;border-radius:0;transform:translateX(105%)}#panel .grab{display:none}}
.ph{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.ph .pnum{width:34px;height:34px;font-size:15px}
.ph input{flex:1;font-size:17px;font-weight:600;border:0;border-bottom:2px solid transparent;padding:6px 2px;outline:0;min-width:0}
.ph input:focus{border-bottom-color:var(--acc)}
.x{background:#f1f2f4;border:0;width:34px;height:34px;border-radius:50%;font-size:16px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{color:#fff;border-color:transparent}
.fl{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:12px}
.fl input,.fl textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;background:#fafbfc;outline:0}
.fl input:focus,.fl textarea:focus{border-color:var(--acc);background:#fff}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph1{width:72px;height:72px;border-radius:10px;background:#eceef1 center/cover;cursor:pointer;border:1px solid var(--line)}
.photos .addp{width:72px;height:72px;border-radius:10px;border:2px dashed #cfd3da;background:#fff;font-size:22px;color:var(--acc)}
.note{padding:10px 12px;background:#f5f6f8;border-radius:12px;margin-bottom:8px}
.note .who{font-size:12px;color:var(--mut);margin-bottom:3px}
.note .who b{color:var(--ink)}
.note p{margin:0;white-space:pre-wrap;word-wrap:break-word}
.noteform{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.noteform textarea{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px;outline:0}
.meta{font-size:12px;color:var(--mut);margin:16px 0 10px}
.pbtns{display:flex;gap:8px}
.pbtns .btn{flex:1}
/* dialog, toast, lightbox */
#dlg{position:fixed;inset:0;background:#0007;z-index:40;display:none;align-items:flex-end;justify-content:center}
#dlg.open{display:flex}
@media(min-width:600px){#dlg{align-items:center}}
.dbox{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:20px 18px 22px}
@media(min-width:600px){.dbox{border-radius:18px}}
.dbox h4{margin:0 0 6px;font-size:17px}
.dbox p{margin:0 0 14px;color:var(--mut);font-size:14px}
.dbtns{display:flex;gap:8px;margin-top:8px}
.dbtns .btn{flex:1}
.acts button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:14px 4px;font-size:16px}
.acts button.danger{color:#d23a3f}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2330;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#lb{position:fixed;inset:0;background:#000e;z-index:45;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#lb.open{display:flex}
#lb img{max-width:94vw;max-height:80vh;border-radius:6px}
.loading{display:grid;place-items:center;height:100%;color:var(--mut)}
</style>
<style>
#sync{font-size:12px;opacity:.75;white-space:nowrap;padding:0 4px}
#sync.warn{color:#ffb4a8;opacity:1}
.center{max-width:440px;margin:0 auto;padding:48px 22px;text-align:center}
.center .logo i{width:44px;height:44px}
.center h1{font-size:26px;margin:18px 0 6px}
.center p{color:var(--mut);margin:0 0 22px}
.ms{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1b1b1b;border:1px solid #8c8c8c;border-radius:6px;padding:12px 18px;font-weight:600}
.ms b{display:grid;grid-template-columns:9px 9px;gap:2px}.ms b i{width:9px;height:9px}
.setup{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px}
.setup code{background:#f1f2f4;padding:1px 5px;border-radius:4px;font-size:13px}
.vbar .pg{display:flex;align-items:center;color:#fff;font-weight:600;font-size:13px}
.vbar .pg button{padding:10px 8px}
.pick .row{cursor:pointer}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid #cfd3da;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.drive{font-size:12px;color:var(--mut);margin:-8px 0 14px}
a.row{color:inherit;text-decoration:none}
#dlg.open~#toast{bottom:auto;top:70px}
.pickbtn{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;background:#fafbfc;text-align:left;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.pickbtn.empty{color:#9aa0a8}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.dbox{max-height:92vh;overflow:auto}
.cdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;flex:none}
.cathd{display:flex;align-items:center;font-weight:600;font-size:14px;margin:18px 0 8px}
.cathd small{color:var(--mut);font-weight:500;margin-left:6px}
.tcat{position:absolute;top:8px;left:8px;border:0;background:#ffffffee;border-radius:8px;width:32px;height:32px;font-size:14px;box-shadow:0 1px 3px #0003;display:grid;place-items:center}
.tile .cl{font-size:11px;color:var(--mut);padding:0 10px 8px;margin-top:-4px;display:flex;align-items:center}
</style>
</head>

  <button id="back" aria-label="Til baka" hidden>‹</button>

<input type="file" id="photoIn" accept="image/*" multiple hidden>
<script>
/* =====================================================================
   STILLINGAR – fylltu inn eftir skráningu appsins í Microsoft Entra (Azure)
   ===================================================================== */
const CONFIG = {
  clientId: '950df0c5-853d-43ef-84db-8b60f1f5bcde',   // Application (client) ID
  tenant:   '00398642-4822-4a7b-a763-f7239ec731b5',          // Directory (tenant) ID, eða 'organizations'
  rootFolder: 'Verkpunktar'           // Rótarmappa verkefna í OneDrive / SharePoint
};
/* ===================================================================== */
"use strict";
const GRAPH='https://graph.microsoft.com/v1.0';
const AUTH=`https://login.microsoftonline.com/${CONFIG.tenant}/oauth2/v2.0`;
const SCOPES='openid profile offline_access User.Read Files.ReadWrite.All Sites.Read.All';
const REDIRECT=location.origin+location.pathname;
const PHOTO_DIR='Myndir punkta',DATA_DIR='_gogn';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CATS=[['Arkitektúr','#4f6bed'],['Burðarvirki','#8b5cf6'],['Lagnir','#0ea5e9'],['Rafmagn','#d4a106'],['Loftræsting','#14b8a6'],['Innréttingar','#ec4899'],['Lóð','#22c55e'],['Annað','#6b7280']];
const catColor=c=>{const f=CATS.find(x=>x[0]===c);if(f)return f[1];let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))%360;return c?`hsl(${h},55%,45%)`:'#9aa0a8'};
const ST={opid:{l:'Opið',c:'#e5484d'},vinnsla:{l:'Í vinnslu',c:'#f5a524'},lokid:{l:'Lokið',c:'#30a46c'}};
const fmt=ts=>ts?new Date(ts).toLocaleString('is-IS',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const fmtD=d=>d?new Date(d+'T12:00').toLocaleDateString('is-IS',{day:'numeric',month:'short'}):'';
const safeName=s=>String(s).replace(/["*:<>?/\\|]/g,'-').replace(/^\.+|\s+$/g,'').slice(0,200)||'Ónefnt';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------------- innskráning (OAuth 2.0 + PKCE, engin aukasöfn) ---------------- */
let tok=ls.get('vp_tok');
class AuthErr extends Error{}
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function saveTok(j){tok={access:j.access_token,exp:Date.now()+((j.expires_in||3600)-90)*1000,refresh:j.refresh_token||(tok&&tok.refresh)};ls.set('vp_tok',tok)}
async function login(){
  const v=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  const st=b64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem('vp_pkce',JSON.stringify({v,st}));
  location.href=AUTH+'/authorize?'+new URLSearchParams({client_id:CONFIG.clientId,response_type:'code',redirect_uri:REDIRECT,scope:SCOPES,code_challenge:ch,code_challenge_method:'S256',state:st,response_mode:'query',prompt:'select_account'});
}
async function handleRedirect(){
  const q=new URLSearchParams(location.search);
  if(q.get('error')){history.replaceState(null,'',REDIRECT);throw new Error(q.get('error_description')||q.get('error'))}
  const code=q.get('code');if(!code)return;
  history.replaceState(null,'',REDIRECT);
  const p=JSON.parse(sessionStorage.getItem('vp_pkce')||'{}');sessionStorage.removeItem('vp_pkce');
  if(!p.v||q.get('state')!==p.st)throw new Error('Innskráning rann út – reyndu aftur.');
  const r=await fetch(AUTH+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CONFIG.clientId,grant_type:'authorization_code',code,redirect_uri:REDIRECT,code_verifier:p.v,scope:SCOPES})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||'Innskráning mistókst');
  saveTok(j);
}
let refreshP=null;
async function getToken(){
  if(tok&&tok.access&&tok.exp>Date.now())return tok.access;
  if(tok&&tok.refresh){
    const p=refreshP||(refreshP=(async()=>{try{const r=await fetch(AUTH+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CONFIG.clientId,grant_type:'refresh_token',refresh_token:tok.refresh,scope:SCOPES,redirect_uri:REDIRECT})});if(!r.ok)return false;saveTok(await r.json());return true}catch(e){return false}finally{refreshP=null}})());
    if(await p)return tok.access;
  }
  tok=null;ls.del('vp_tok');throw new AuthErr('Innskráning útrunnin');
}
function logout(){ls.del('vp_tok');tok=null;location.href=`${AUTH}/logout?post_logout_redirect_uri=${encodeURIComponent(REDIRECT)}`}

/* ---------------- Microsoft Graph ---------------- */
async function g(path,opt={},tries=0){
  const t=await getToken();
  const r=await fetch(path.startsWith('http')?path:GRAPH+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
  if(r.status===401&&tries<1){if(tok)tok.exp=0;return g(path,opt,tries+1)}
  if([429,503,504].includes(r.status)&&tries<3){await sleep((+r.headers.get('Retry-After')||2)*1000);return g(path,opt,tries+1)}
  return r;
}
async function gj(path,opt){
  const r=await g(path,opt);
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}const e=new Error(m||('Villa '+r.status));e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
let cfg=ls.get('vp_cfg')||{driveBase:'/me/drive',driveName:'Mitt OneDrive'};
const D=()=>cfg.driveBase;
const P=name=>encodeURIComponent(name);
async function children(id){let url=`${D()}/items/${id}/children?$top=500&$expand=thumbnails`,out=[];while(url){const j=await gj(url);out.push(...j.value);url=j['@odata.nextLink']}return out}
async function childByName(pid,name){try{return await gj(`${D()}/items/${pid}:/${P(name)}`)}catch(e){if(e.status===404)return null;throw e}}
const mkdir=(pid,name,cb='rename')=>gj(`${D()}/items/${pid}/children`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:safeName(name),folder:{},'@microsoft.graph.conflictBehavior':cb})});
async function ensureDir(pid,name){const c=await childByName(pid,name);if(c)return c;try{return await mkdir(pid,name,'fail')}catch(e){if(e.status===409)return childByName(pid,name);throw e}}
async function uploadFile(pid,name,blob,onProg){
  const base=`${D()}/items/${pid}:/${P(safeName(name))}:`;
  if(blob.size<=4e6)return gj(`${base}/content?@microsoft.graph.conflictBehavior=rename`,{method:'PUT',headers:{'Content-Type':blob.type||'application/octet-stream'},body:blob});

}

async function doSave(id){

      const r=await g(scUrl(id)+':/content'+(rec.eTag?'':'?@microsoft.graph.conflictBehavior=fail'),{method:'PUT',headers:h,body:JSON.stringify(rec.d)});
      if(r.ok){const it=await r.json();rec.eTag=it.eTag;rec.err=false;if(!rec.dirty)break;continue}

    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await p.render({canvasContext:x,viewport:vp}).promise;
    out={url:URL.createObjectURL(await toBlob(c,'image/png')),w:c.width,h:c.height,pages:pdf.numPages};
  }else{
    const u=URL.createObjectURL(await fileBlob(it.id));const im=await loadImg(u);out={url:u,w:im.naturalWidth,h:im.naturalHeight,pages:1};
  }
  pageImgs.set(key,out);return out;
}
async function openSheet(it,pg,pinId){
  if(!it)return;closePanel();view='sheet';curSheet=it;page=pg||1;addMode=false;moveMode=null;
  setHeader(it.name,curFolder().name,true);
  const v=$('#view');v.classList.add('full');v.innerHTML='<div class="loading"><span class="spin"></span></div>';
  const [rec,img]=await Promise.all([loadSc(it.id),pageImage(it,page)]);
  if(curSheet!==it)return;
  if(rec.changed!==undefined)rec.changed=false;
  pages=img.pages;dims={w:img.w,h:img.h};
  v.innerHTML=`<div class="viewer" id="vw"><div class="inner" id="vin" style="width:${img.w}px;height:${img.h}px"><img src="${img.url}" width="${img.w}" height="${img.h}" alt=""><div id="pins"></div></div></div>
  <div class="hint" id="hint" hidden></div>
  <div class="vbar"><button data-v="add">＋ Punktur</button>${pages>1?`<span class="pg"><button data-v="prev">‹</button>bls. ${page}/${pages}<button data-v="next">›</button></span>`:''}<button data-v="list">☰ Punktar</button><button data-v="fit">⤢</button></div>`;
  vw=$('#vw');vin=$('#vin');setupViewer();fit();renderPins();updateVbar();
  $('.vbar').onclick=safe(async e=>{const b=e.target.closest('[data-v]');if(!b)return;const a=b.dataset.v;
    if(a==='add'){addMode=!addMode;moveMode=null;if(addMode)closePanel();updateVbar()}
    if(a==='fit')fit();
    if(a==='list')showSheetList();
    if(a==='prev'&&page>1)openSheet(it,page-1);
    if(a==='next'&&page<pages)openSheet(it,page+1);
  });
  if(pinId)openPin(pinId,true);
  clearInterval(pollT);pollT=setInterval(poll,20000);
}
async function poll(){
  if(view!=='sheet'||!curSheet||document.hidden)return;
  try{const id=curSheet.id;const r=await loadSc(id,true);if(r.changed){r.changed=false;if(curSheet&&curSheet.id===id)render()}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();else flushAll()});
addEventListener('pagehide',flushAll);
function flushAll(){for(const[id,r]of SC)if(r.dirty)flush(id)}
function applyZ(){vin.style.transform=`translate(${vz.x}px,${vz.y}px) scale(${vz.s})`;vin.style.setProperty('--inv',1/vz.s)}
function fit(){if(!vw)return;const r=vw.getBoundingClientRect();fitS=Math.min(r.width/dims.w,(r.height-70)/dims.h)*.95;vz={s:fitS,x:(r.width-dims.w*fitS)/2,y:(r.height-70-dims.h*fitS)/2+6};applyZ()}
const clampS=s=>Math.max(fitS*.5,Math.min(s,Math.max(4,fitS*12)));
function zoomAt(px,py,ns){ns=clampS(ns);vz.x=px-(px-vz.x)*(ns/vz.s);vz.y=py-(py-vz.y)*(ns/vz.s);vz.s=ns;applyZ()}
function focusPin(p){if(!vw)return;const r=vw.getBoundingClientRect();vz.s=Math.max(vz.s,Math.min(fitS*3,Math.max(1,fitS)));const wide=innerWidth>=900;const cx=wide?(r.width-400)/2:r.width/2,cy=wide?r.height/2:r.height*.2;vz.x=cx-p.x*dims.w*vz.s;vz.y=cy-p.y*dims.h*vz.s;applyZ()}
function setupViewer(){
  const ptrs=new Map();let gs=null;
  const rel=e=>{const r=vw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  vw.addEventListener('wheel',e=>{e.preventDefault();const p=rel(e);zoomAt(p.x,p.y,vz.s*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
  vw.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,rel(e));
    if(ptrs.size===1){const p=rel(e);gs={t:'pan',sx:p.x,sy:p.y,ox:vz.x,oy:vz.y,moved:false,target:e.target}}
    else if(ptrs.size===2){const[a,b]=[...ptrs.values()];gs={t:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},s0:vz.s,ox:vz.x,oy:vz.y}}});
  vw.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!gs)return;ptrs.set(e.pointerId,rel(e));
    if(gs.t==='pan'&&ptrs.size===1){const p=rel(e),dx=p.x-gs.sx,dy=p.y-gs.sy;if(!gs.moved&&Math.hypot(dx,dy)>7)gs.moved=true;if(gs.moved){vz.x=gs.ox+dx;vz.y=gs.oy+dy;applyZ()}}
    else if(gs.t==='pinch'&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const ns=clampS(gs.s0*d/gs.d0);vz.x=m.x-(gs.m0.x-gs.ox)*(ns/gs.s0);vz.y=m.y-(gs.m0.y-gs.oy)*(ns/gs.s0);vz.s=ns;applyZ()}});
  const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(gs&&gs.t==='pan'&&!gs.moved&&e.type==='pointerup')tap(e,gs.target);
    if(ptrs.size===1){const p=[...ptrs.values()][0];gs={t:'pan',sx:p.x,sy:p.y,ox:vz.x,oy:vz.y,moved:true}}else if(!ptrs.size)gs=null};
  vw.addEventListener('pointerup',up);vw.addEventListener('pointercancel',up);
}
function tap(e,target){
  const pinEl=target&&target.closest&&target.closest('.pin');
  const r=vw.getBoundingClientRect(),p={x:(e.clientX-r.left-vz.x)/vz.s/dims.w,y:(e.clientY-r.top-vz.y)/vz.s/dims.h};
  const inside=p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1;
  if(moveMode){if(inside){const id=moveMode;moveMode=null;editPin(id,{x:p.x,y:p.y});updateVbar();openPin(id)}return}
  if(pinEl)return openPin(pinEl.dataset.pin);
  if(addMode){if(!inside)return toast('Settu punktinn á teikninguna');createPin(p.x,p.y);return}
  if(openPinId)closePanel();
}
const sheetPins=()=>{const rec=curSheet&&SC.get(curSheet.id);return rec?livePins(rec.d).filter(([,p])=>(p.page||1)===page).sort((a,b)=>a[1].n-b[1].n):[]};
function createPin(x,y){
  const rec=SC.get(curSheet.id);stamp(rec,curSheet);
  const n=livePins(rec.d).filter(([,p])=>(p.page||1)===page).reduce((m,[,p])=>Math.max(m,p.n||0),0)+1,id=uid(),now=Date.now();

  touch(curSheet.id);addMode=false;updateVbar();renderPins();openPin(id);setTimeout(()=>{const t=$('#p-title');if(t)t.focus()},260);
}
function editPin(pid,ch){const rec=SC.get(curSheet.id);if(!rec||!rec.d.pins[pid])return;stamp(rec,curSheet);rec.d.pins[pid]={...rec.d.pins[pid],...ch,updatedAt:Date.now(),updatedBy:me.name||me.email};touch(curSheet.id);render()}
function renderPins(){const box=$('#pins');if(!box)return;box.innerHTML=sheetPins().map(([id,p])=>`<div class="pin ${id===openPinId?'sel':''}" data-pin="${esc(id)}" style="left:${p.x*100}%;top:${p.y*100}%;--c:${(ST[p.status]||ST.opid).c}"><span>${p.n}</span></div>`).join('')}
function updateVbar(){
  const b=document.querySelector('[data-v="add"]');if(b)b.classList.toggle('on',addMode);
  const l=document.querySelector('[data-v="list"]');if(l){const o=openCount(sheetPins());l.textContent=`☰ Punktar${o?` (${o})`:''}`}
  const h=$('#hint');if(h){h.hidden=!(addMode||moveMode);h.textContent=moveMode?'Pikkaðu þar sem punkturinn á að vera':'Pikkaðu á teikninguna til að setja punkt'}
  if(vw)vw.classList.toggle('adding',!!(addMode||moveMode));
}
function render(){if(view==='people')return renderPeople();if(view==='sheet'){renderPins();updateVbar();if($('#panel').classList.contains('open'))renderPanel(false)}else if(view==='folder')renderFolder(false)}
function showSheetList(){
  openPinId=null;renderPins();$('#panel').dataset.mode='list';
  $('#pbody').innerHTML=`<div class="ph"><b style="flex:1;font-size:17px">Punktar${pages>1?` á bls. ${page}`:''}</b><button class="x" data-pa="close">✕</button></div><div id="slist">${pinListHTML(sheetPins().map(([pid,p])=>({fid:curSheet.id,pid,p})),false)}</div>`;

function openPin(id,focus){
  openPinId=id;$('#panel').dataset.mode='pin';renderPanel(true);$('#panel').classList.add('open');renderPins();
  const rec=SC.get(curSheet.id),p=rec&&rec.d.pins[id];if(p&&(focus||innerWidth<900))setTimeout(()=>focusPin(p),focus?60:0);
}
function closePanel(){flushFields();$('#panel').classList.remove('open');if(openPinId){openPinId=null;renderPins()}}
function renderPanel(full){
  const pb=$('#pbody');
  if($('#panel').dataset.mode==='list'){const sl=$('#slist');if(sl&&!(document.activeElement&&document.activeElement.id==='q'))sl.innerHTML=pinListHTML(sheetPins().map(([pid,p])=>({fid:curSheet.id,pid,p})),false);return}
  const rec=SC.get(curSheet.id),id=openPinId,p=rec&&rec.d.pins[id];if(!p||p.deleted){closePanel();return}

  const notesHTML=notes.length?notes.map(([nid,n])=>`<div class="note"><div class="who"><b>${esc(n.by===(me.name||me.email)?'Þú':n.by||'Notandi')}</b> · ${fmt(n.createdAt)}</div><p>${esc(n.text)}</p></div>`).join(''):'<div style="color:var(--mut);font-size:14px;margin-bottom:6px">Engar athugasemdir enn.</div>';
  const seg=Object.entries(ST).map(([k,v])=>`<button data-pa="st" data-v="${k}" class="${p.status===k?'on':''}" style="${p.status===k?`background:${v.c}`:''}">${v.l}</button>`).join('');

    <div class="fl" style="margin-top:16px">Athugasemdir</div><div id="p-notes">${notesHTML}</div>
    <div class="noteform"><textarea id="p-note" placeholder="Skrifa athugasemd…"></textarea><button class="btn" data-pa="send">Senda</button></div>
    <div class="meta">Stofnað af ${esc(p.createdBy||'')} · ${fmt(p.createdAt)}${p.updatedBy?` · síðast breytt af ${esc(p.updatedBy)}`:''}</div>
    <div class="pbtns"><button class="btn ghost" data-pa="move">✥ Færa punkt</button><button class="btn danger" data-pa="del">Eyða punkti</button></div>`;

    {const ab=$('#p-assignee');if(ab){const l=assigneeLabel(p);ab.textContent=l||'Velja aðila…';ab.classList.toggle('empty',!l)}}

const pending={};let fieldT=null;

}));
